<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactez-nous</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Contactez-nous</h1>
</header>

<nav>
    <a href="index.html">Accueil</a> |
    <a href="destinations.html">Destinations</a> |
    <a href="activites.html">Activités</a> |
    <a href="contact.html">Contact</a>
    <a href="connexion.html">connexion</a>
</nav>

<main>
    <form action="#" method="post">

        <fieldset>
            <legend>1 – Vos coordonnées</legend>

            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom"
                   placeholder="Votre nom" required
                   autofocus maxlength="50">

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom"
                   placeholder="Votre prénom" required
                   maxlength="50">

            <label for="naissance">Date de naissance :</label>
            <input type="date" id="naissance" name="naissance">

            <label for="email">Adresse email :</label>
            <input type="email" id="email" name="email"
                   placeholder="exemple@email.com" required>

            <label for="site">Site web :</label>
            <input type="url" id="site" name="site"
                   value="http://www."
                   placeholder="https://monsite.com">

            <label for="password">Code secret :</label>
            <input type="password" id="password" name="password"
                   minlength="6" maxlength="20">

            <p>Genre :</p>
            <input type="radio" id="homme" name="genre"
                   value="Homme" checked>
            <label for="homme">Homme</label>

            <input type="radio" id="femme" name="genre"
                   value="Femme">
            <label for="femme">Femme</label>
        </fieldset>

        <fieldset>
            <legend>2 – Informations complémentaires</legend>

            <label for="pays">Pays :</label>
            <select id="pays" name="pays">
                <option>Tunisie</option>
                <option>France</option>
                <option>Algérie</option>
                <option>Maroc</option>
                <option>Autre</option>
            </select>

            <label for="telephone">Téléphone :</label>
            <input type="tel" id="telephone" name="telephone"
                   pattern="[0-9]{8}"
                   placeholder="12345678">

            <label for="adresse">Adresse postale :</label>
            <input type="text" id="adresse" name="adresse"
                   placeholder="Votre adresse">

            <label for="postal">Code postal :</label>
            <input type="text" id="postal" name="postal"
                   value="1000" maxlength="4">

            <label for="semestre">Semestre :</label>
            <select id="semestre" name="semestre">
                <option>S1</option>
                <option>S2</option>
                <option>S3</option>
                <option>S4</option>
            </select>

            <label for="region">Région préférée :</label>
            <select id="region" name="region">
                <option>Tunis</option>
                <option>Sousse</option>
                <option>Sfax</option>
                <option>Djerba</option>
                <option>Tozeur</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>3 – Goûts et centres d'intérêt</legend>

            <p>Centres d'intérêt :</p>

            <input type="checkbox" id="culture"
                   name="interets[]" value="Culture" checked>
            <label for="culture">Culture</label>

            <input type="checkbox" id="gastronomie"
                   name="interets[]" value="Gastronomie">
            <label for="gastronomie">Gastronomie</label>

            <input type="checkbox" id="plage"
                   name="interets[]" value="Plage">
            <label for="plage">Plage</label>

            <input type="checkbox" id="desert"
                   name="interets[]" value="Désert">
            <label for="desert">Désert</label>

            <input type="checkbox" id="histoire"
                   name="interets[]" value="Histoire">
            <label for="histoire">Histoire</label>

            <label for="niveau">Niveau en HTML :</label>
            <input type="range" id="niveau" name="niveau"
                   min="0" max="100" step="10">

            <label for="note">Note de satisfaction :</label>
            <input type="number" id="note" name="note"
                   min="1" max="10" step="1">

            <label for="message">Message / Commentaire :</label>
            <textarea id="message" name="message"
                      rows="5" cols="40"
                      placeholder="Votre message..."></textarea>
        </fieldset>

        <fieldset>
            <legend>4 – Photo</legend>

            <label for="photo">Photo de profil :</label>
            <input type="file" id="photo" name="photo"
                   accept="image/*">
        </fieldset>

        <input type="submit" value="Envoyer">
        <input type="reset" value="Effacer">

    </form>

    <p><a href="index.html">Retour à l'accueil</a></p>
</main>

<footer>
    <p>&copy; 2026 - Mon Projet. Tous droits réservés.</p>
</footer>

</body>
</html>
